persona:
  name: "Franco"
  company: "Your Company"
  role: "Business Development"
  email: "franco@yourcompany.com"
  linkedin: "linkedin.com/in/franco-yourcompany"
  tone: "professional, consultative, confident"

product:
  name: "Your Product"
  description: "Describe what your product does and who it's for"
  pricing: "Starting at $X/mo"
  key_benefits:
    - "Benefit 1"
    - "Benefit 2"
    - "Benefit 3"
  objection_responses:
    "too expensive": "I understand budget is important. Most of our clients see ROI within 30 days..."
    "already have a solution": "That makes sense. Curious — what's the one thing you wish it did better?"
    "not interested": "No worries at all. Mind if I ask what your current approach looks like?"
  offer:
    primary: ""                    # Main offer (e.g., "Monthly subscription starting at $99/mo")
    entry: ""                      # Low-commitment entry (e.g., "14-day free trial", "Free audit")
    goal: "book_call"              # Goal of outreach: book_call, start_trial, get_reply
    booking_method: "calendar_link" # calendar_link, suggest_times, ask_preference
    booking_url: ""                # Calendar link URL (if using calendar_link method)
    meeting_duration: "15 minutes" # How long the call is
    meeting_owner: ""              # Who takes the meeting (name or role)

icp:
  industries:
    - "SaaS"
    - "Marketing Agency"
  company_size: "10-200 employees"
  titles:
    - "VP Marketing"
    - "Head of Growth"
    - "CMO"
    - "Director of Marketing"
  geography:
    - "United States"
  # Roles that signal a company is in-market RIGHT NOW (a company hiring a
  # "Head of Growth" is shopping for growth tooling). Used for careers-page
  # scanning and job-board discovery. Empty = fall back to titles above.
  hiring_signals: []

channels:
  email:
    enabled: true
    provider: "gmail"          # gmail (recommended) | smtp | instantly
    max_daily_sends: 50
    require_approval: true      # native providers: emails wait in the Outbox
    send_to_risky: false        # also send to catch-all domains (off = safest)
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
  linkedin:
    enabled: true
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/New_York"

# How sequences are produced.
#   generated: the writer drafts each sequence with the model (default).
#   templates: approved copy, sent word for word to accounts you import with
#              `franco import accounts.csv` (see README → Approved-copy outreach).
outreach:
  mode: "generated"
  timezone: "America/New_York"   # business days and send times are counted here
  send_hour: 9
  observation_max_age_days: 90   # older research can't fill {{verified_observation}}
  preview_accounts: 10           # per owner, held for review until `franco preview signoff KEY`
  campaigns: {}
  #   M1:
  #     name: "First campaign"
  #     steps:
  #       - day: 1
  #         subject: "{{company}} and ..."
  #         body: |
  #           Hi {{first_name}},
  #
  #           I noticed {{verified_observation}}.
  #           ...
  #       - { day: 5, subject: "...", body: "..." }
  reply_templates: {}            # approved wording per reply intent, e.g. later: "Understood. ..."

# Commercial-email rules, enforced in code at send time. With require_footer
# on, NO cold email is sent until postal_address is your real address.
compliance:
  require_footer: true
  postal_address: ""             # your physical business address (CAN-SPAM)
  footer: "{sender_name} | {company} | {postal_address}. Business outreach about {company}. Reply \"no thanks\" to stop."
  unsubscribe_url: ""            # optional HTTPS one-click endpoint; mailto: is always offered
  blocked_claims: []             # phrases no outgoing email may contain
  send_opt_out_ack: false        # reply once after recording an opt-out
  opt_out_ack: "Understood. I have recorded the request to stop."
  # Optional: before the first cold email to each address, ask Precleared
  # (precleared.dev) whether cold email to it is allowed under the rules of
  # the recipient's country (UK PECR, US CAN-SPAM, Canada's CASL and others).
  # A new address is checked after a cycle's sending, and its email is
  # decided on the next cycle. Any verdict but ok_to_email stops that email,
  # with the rule and the next step in the Outbox. One check per address,
  # reused by its follow-ups for 30 days. Needs require_footer: true.
  # Native providers (gmail, smtp) only. A free key (PRECLEARED_API_KEY in
  # .env) raises the daily allowance. Precleared receives the address, the
  # settings below and the first 200 characters of product.description.
  precleared:
    enabled: false
    sender_country: ""           # GB, US or AE: where your business is based
    address_source: "unknown"    # published | bought | scraped | given | unknown
    prospect_country: ""         # optional, e.g. "US" if all your prospects are in one country
